nxos:
  global:
    variables:
      bgp_asn: 65000
      anycast_rp_ip: 10.254.254.1
      anycast_gw_mac: 00:00:22:22:33:33

  device_groups:
    - name: FABRIC
      templates:
        - global
        - underlay_ip
        - underlay_ospf
        - underlay_multicast
        - overlay_bgp
    - name: LEAFS
      templates:
        - overlay_vxlan
    - name: SPINES
    - name: VPC_LEAFS
      templates:
        - underlay_vpc

  devices:
    - name: LEAF1
      url: https://192.168.1.11
      device_groups:
        - FABRIC
        - LEAFS
        - VPC_LEAFS
      variables:
        mgmt_ip: 192.168.1.11
        leaf_id: 1

    - name: LEAF2
      url: https://192.168.1.12
      device_groups:
        - FABRIC
        - LEAFS
        - VPC_LEAFS
      variables:
        mgmt_ip: 192.168.1.12
        leaf_id: 2

    - name: SPINE1
      url: https://192.168.1.13
      device_groups:
        - FABRIC
        - SPINES
      variables:
        mgmt_ip: 192.168.1.13
        spine_id: 1

    - name: SPINE2
      url: https://192.168.1.14
      device_groups:
        - FABRIC
        - SPINES
      variables:
        mgmt_ip: 192.168.1.14
        spine_id: 2
